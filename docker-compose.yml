version: "3.9"

services:
  # ─── FRONTEND ────────────────────────────────────────
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_WS_URL=ws://api-gateway:8000
    depends_on: [api-gateway]

  # ─── API GATEWAY ─────────────────────────────────────
  api-gateway:
    image: kong:3.4
    ports: ["8000:8000", "8001:8001"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
    volumes:
      - ./infra/kong.yml:/kong/kong.yml

  # ─── MICROSERVICES ────────────────────────────────────
  auth-service:
    build: ./backend/auth-service
    ports: ["8010:8010"]
    environment:
      - DATABASE_URL=postgresql://docuflow:secret@postgres/docuflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [postgres, redis]

  doc-service:
    build: ./backend/doc-service
    ports: ["8020:8020"]
    environment:
      - DATABASE_URL=postgresql://docuflow:secret@postgres/docuflow
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - KAFKA_BROKERS=kafka:9092
    depends_on: [postgres, redis, kafka, minio]

  ai-service:
    build: ./backend/ai-service
    ports: ["8030:8030"]
    environment:
      - DATABASE_URL=postgresql://docuflow:secret@postgres/docuflow
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KAFKA_BROKERS=kafka:9092
    depends_on: [postgres, qdrant, kafka]

  workflow-service:
    build: ./backend/workflow-service
    ports: ["8040:8040"]
    environment:
      - DATABASE_URL=postgresql://docuflow:secret@postgres/docuflow
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
    depends_on: [postgres, kafka, redis]

  integration-service:
    build: ./backend/integration-service
    ports: ["8050:8050"]
    environment:
      - DATABASE_URL=postgresql://docuflow:secret@postgres/docuflow
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
    depends_on: [postgres, kafka, redis]

  # ─── DATA STORES ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  elasticsearch:
    image: elasticsearch:8.11.0
    ports: ["9200:9200"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes: [esdata:/usr/share/elasticsearch/data]

  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: docuflow
      MINIO_ROOT_PASSWORD: secret123
    command: server /data --console-address ":9001"
    volumes: [miniodata:/data]

  # ─── MESSAGE BUS ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    depends_on: [zookeeper]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: docuflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ─── OBSERVABILITY ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [grafanadata:/var/lib/grafana]

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  esdata: {}
  miniodata: {}
  grafanadata: {}
